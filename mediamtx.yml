# $schema: https://mediamtx.rtfd.io/schemas/v1.6/mediamtx.schema.json

paths:
  left:
    source: rtsp://192.168.100.100
  main:
    source: rtsp://192.168.100.101
  right:
    source: rtsp://192.168.100.102
  altar:
    source: rtsp://192.168.100.103
  baptism:
    source: rtsp://192.168.100.104
  basement:
    source: rtsp://192.168.100.105
  # atem:
  #   source: rtsp://localhost:559/atem
  atem:
    source: publisher
    # sourceOnDemand: yes
    runOnInit: ffmpeg -loglevel warning -f dshow -rtbufsize 200M -i video="Blackmagic Design" -an -c:v h264 -preset ultrafast -tune zerolatency -b:v 4500k -g 60 -r 30 -vsync cfr -use_wallclock_as_timestamps 1 -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:8554/atem
    runOnInitRestart: yes
    runOnDemandRestart: yes
    runOnDemandStartTimeout: 15s
  atem-audio:
    source: publisher
    runOnInit: ffmpeg -loglevel warning -f dshow -i audio="Microphone (Blackmagic Design)" -vn -c:a aac -b:a 128k -ac 2 -ar 48000 -async 1 -vsync cfr -f rtsp rtsp://127.0.0.1:8554/atem-audio
    runOnInitRestart: yes
    runOnDemandRestart: yes
    runOnDemandStartTimeout: 15s

hls: yes
hlsAddress: :8888
hlsSegmentDuration: 4s
hlsPartDuration: 1s
hlsVariant: lowLatency
# hlsSegmentType: mpegts          # ← this is the magic for iPhone/Safari audio
# hlsUseSystemTime: yes


webrtc: yes
webrtcAddress: :8889
# webrtcLocalUDPAddress: "" # Disabled local UDP address for WebRTC
webrtcLocalTCPAddress: :8189 # Added local TCP address for WebRTC
webrtcAdditionalHosts: [192.168.100.252, "ptz.vmspchurch.org", "ptz-rtc.vmspchurch.org", "localhost", "remote.vmspchurch.org"]
webrtcAllowOrigin: "*"
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
  # - url: turn:openrelay.metered.ca:80?transport=tcp
  #   username: openrelayproject
  #   password: openrelayproject
  # # Optional second TURN for redundancy (also TCP-capable)
  # - url: turn:openrelay.metered.ca:443?transport=tcp
  #   username: openrelayproject
  #   password: openrelayproject