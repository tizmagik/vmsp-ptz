<!-- Paste this into ScreenTinker's Text/HTML widget. CSS field can stay empty. -->
<div id="vmsp-embed">
  <iframe id="vmsp-events-frame" title="This week at church" loading="eager"></iframe>
  <div id="vmsp-embed-status" role="status" aria-live="polite">Connecting to the church schedule…</div>
</div>
<style>
  html, body { margin: 0; width: 100%; height: 100%; }
  #vmsp-embed { position: relative; width: 100%; height: 100vh; min-height: 100%; overflow: hidden; background: #13151c; }
  #vmsp-events-frame { display: block; width: 100%; height: 100%; border: 0; opacity: 0; }
  #vmsp-embed-status { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px;
    color: #f8f4ed; font: 600 clamp(22px, 2.3vw, 38px) "Avenir Next", Avenir, "Segoe UI", sans-serif;
    text-align: center; }
  #vmsp-embed-status[hidden] { display: none; }
</style>
<script>
  (() => {
    "use strict";
    const LOCAL_ORIGIN = "http://192.168.100.252:8111";
    const REMOTE_ORIGIN = "https://remote.vmspchurch.org";
    const INCLUDE_CELEBRATIONS = false; // Set true to load /events?celebrations.
    const PAGE_PATH = INCLUDE_CELEBRATIONS ? "/events?celebrations" : "/events";
    // ScreenTinker may run widget code inside about:srcdoc, so inspect its parent URL too.
    const contextUrls = [window.location.href, document.referrer, document.baseURI,
      ...Array.from(window.location.ancestorOrigins || [])];
    try { contextUrls.push(window.parent.location.href); } catch { /* Cross-origin parent. */ }
    const contextHosts = contextUrls.flatMap(value => {
      try { return [new URL(value).hostname.toLowerCase()]; } catch { return []; }
    }).filter(Boolean);
    const useRemotePage = contextHosts.some(host =>
      host === "vmspchurch.org" || host.endsWith(".vmspchurch.org")) ||
      (!contextHosts.length && window.isSecureContext);
    const CHECK_INTERVAL_MS = 20000;
    const LOCAL_PROBE_TIMEOUT_MS = 4000;
    const PAGE_READY_TIMEOUT_MS = 30000;
    const LOCAL_RETRY_DELAY_MS = 60000;
    const frame = document.getElementById("vmsp-events-frame");
    const status = document.getElementById("vmsp-embed-status");
    let activeOrigin = "", confirmed = false, awaiting = false, checking = false;
    let readyTimer, localRetryAfter = 0;

    async function localReachable() {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), LOCAL_PROBE_TIMEOUT_MS);
      try {
        const response = await fetch(`${LOCAL_ORIGIN}/events`, {
          method: "HEAD", cache: "no-store", mode: "cors", signal: controller.signal
        });
        return response.ok;
      } catch {
        return false;
      } finally {
        clearTimeout(timeout);
      }
    }

    function load(origin) {
      clearTimeout(readyTimer);
      activeOrigin = origin;
      confirmed = false;
      awaiting = true;
      frame.style.opacity = "0";
      status.hidden = false;
      status.textContent = "Connecting to the church schedule…";
      frame.src = `${origin}${PAGE_PATH}`;
      readyTimer = setTimeout(() => {
        if (confirmed) return;
        awaiting = false;
        if (origin === LOCAL_ORIGIN) {
          localRetryAfter = Date.now() + LOCAL_RETRY_DELAY_MS;
          load(REMOTE_ORIGIN);
        } else {
          status.textContent = "Waiting for the church schedule…";
        }
      }, PAGE_READY_TIMEOUT_MS);
    }

    window.addEventListener("message", event => {
      if (event.source !== frame.contentWindow || event.origin !== activeOrigin ||
          event.data?.type !== "vmsp-events-ready") return;
      clearTimeout(readyTimer);
      confirmed = true;
      awaiting = false;
      status.hidden = true;
      frame.style.opacity = "1";
    });

    async function check() {
      if (checking) return;
      checking = true;
      try {
        if (useRemotePage) {
          if (activeOrigin !== REMOTE_ORIGIN || (!confirmed && !awaiting)) load(REMOTE_ORIGIN);
          return;
        }
        const localUp = Date.now() >= localRetryAfter && await localReachable();
        if (localUp) {
          if (activeOrigin !== LOCAL_ORIGIN || (!confirmed && !awaiting)) load(LOCAL_ORIGIN);
        } else if (activeOrigin !== REMOTE_ORIGIN || (!confirmed && !awaiting)) {
          load(REMOTE_ORIGIN);
        }
      } finally {
        checking = false;
      }
    }

    check();
    setInterval(check, CHECK_INTERVAL_MS);
    window.addEventListener("online", check);
  })();
</script>
