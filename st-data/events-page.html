<style>

<script>
  (() => {
    "use strict";

    const CONFIG = {
      churchTimeZone: "America/New_York",
      daysIncludingToday: 7,
      maxEventsPerPage: 12,
      maxEventsPerTimeCard: 8,
      fullRotationSeconds: 50,
      refreshMinutes: 15,
      retryBaseSeconds: 5,
      retryMaxSeconds: 60,
      requestTimeoutSeconds: 60
    };

    const root = document.getElementById("vmsp-week");
    const stage = root.querySelector(".vmsp-stage");
    const section = root.querySelector("#vmsp-section");
    const status = root.querySelector("#vmsp-status");
    const pageLabel = root.querySelector("#vmsp-page");
    const progress = root.querySelector("#vmsp-progress");
    const empty = root.querySelector("#vmsp-empty");
    const weekRange = root.querySelector("#vmsp-week-range");
    const currentDay = root.querySelector("#vmsp-current-day");
    const countLabel = root.querySelector("#vmsp-count");
    let pages = [], pageIndex = 0, rotationTimer, transitionTimer, resizeTimer;
    let pageIntervalMs = 0, nextAdvanceAt = 0;
    let refreshInProgress = false, refreshTimer, failedRefreshes = 0;
    let latestEvents = null, latestCelebrations = null;
    let latestFirst = "", latestLast = "", transitionMs = 650;

    const pad = n => String(n).padStart(2, "0");
    const dateKey = d => {
      const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", {
        timeZone: CONFIG.churchTimeZone, year: "numeric", month: "2-digit", day: "2-digit"
      }).formatToParts(d).map(x => [x.type, x.value]));
      return `${p.year}-${p.month}-${p.day}`;
    };
    const addDays = (key, count) => {
      const [y, m, d] = key.split("-").map(Number);
      return new Date(Date.UTC(y, m - 1, d + count)).toISOString().slice(0, 10);
    };
    const asUtcDay = key => new Date(`${key}T12:00:00Z`);
    const dayLabel = key => new Intl.DateTimeFormat("en-US", {
      timeZone: "UTC", weekday: "long", month: "long", day: "numeric"
    }).format(asUtcDay(key));
    const shortDay = key => new Intl.DateTimeFormat("en-US", {
      timeZone: "UTC", weekday: "short", month: "short", day: "numeric"
    }).format(asUtcDay(key));
    const timeLabel = start => {
      const match = /T(\d{2}):(\d{2})/.exec(start || "");
      if (!match) return "All day";
      const h = Number(match[1]);
      return `${h % 12 || 12}:${match[2]} ${h < 12 ? "AM" : "PM"}`;
    };
    const timeOrder = label => {
      if (label === "All day") return -1;
      const match = /^(\d+):(\d+) (AM|PM)$/.exec(label);
      return match ? ((Number(match[1]) % 12) + (match[3] === "PM" ? 12 : 0)) * 60 + Number(match[2]) : Infinity;
    };
    const make = (tag, className, value) => {
      const el = document.createElement(tag);
      el.className = className;
      if (value !== undefined) el.textContent = value;
      return el;
    };

    // Keep confetti above the entire frame, including the header and footer.
    const confetti = make("div", "vmsp-confetti");
    confetti.setAttribute("aria-hidden", "true");
    const confettiColors = ["#ffa68e", "#ffcf9b", "#90d9d2", "#a8baff", "#f7e6a7"];
    for (let i = 0; i < 40; i++) {
      const piece = document.createElement("i");
      piece.style.setProperty("--x", `${(i * 37.7) % 100}%`);
      piece.style.setProperty("--size", `${6 + i % 4 * 2}px`);
      piece.style.setProperty("--color", confettiColors[i % confettiColors.length]);
      piece.style.setProperty("--duration", `${5 + i % 5}s`);
      piece.style.setProperty("--delay", `${-i * .53}s`);
      confetti.append(piece);
    }
    root.append(confetti);

    // The server embeds display-only data in this page. Refresh from /events itself.
    // The ChMeetings API key never enters the browser.
    function readPageData(pageDocument) {
      const node = pageDocument.getElementById("vmsp-feed-data");
      if (!node) throw new Error("Events page is missing its schedule data.");
      const data = JSON.parse(node.textContent || "null");
      if (!data || !(Array.isArray(data.events) || data.events === null) ||
          !(Array.isArray(data.celebrations) || data.celebrations === null)) {
        throw new Error("Unexpected events page data.");
      }
      return data;
    }

    let embeddedPageData = readPageData(document);
    async function fetchPageData() {
      if (embeddedPageData) {
        const data = embeddedPageData;
        embeddedPageData = null;
        return data;
      }
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), CONFIG.requestTimeoutSeconds * 1000);
      try {
        const response = await fetch(window.location.pathname + window.location.search,
          { cache: "no-store", signal: controller.signal });
        if (!response.ok) throw new Error(`Events page returned HTTP ${response.status}.`);
        const pageDocument = new DOMParser().parseFromString(await response.text(), "text/html");
        return readPageData(pageDocument);
      } finally {
        clearTimeout(timeout);
      }
    }

    function prepare(events, first, last, pageCapacity) {
      const byDay = new Map();
      for (const event of events) {
        if (!event?.title || !event.start) continue;
        const day = String(event.start).slice(0, 10);
        if (day < first || day > last) continue;
        if (!byDay.has(day)) byDay.set(day, new Map());
        const time = timeLabel(event.start);
        if (!byDay.get(day).has(time)) byDay.get(day).set(time, []);
        byDay.get(day).get(time).push(event);
      }
      const result = [];
      for (const [day, times] of [...byDay.entries()].sort(([a], [b]) => a.localeCompare(b))) {
        const groups = [...times.entries()]
          .sort(([a], [b]) => timeOrder(a) - timeOrder(b))
          .map(([time, items]) => ({ time, items: items.sort((a, b) => a.title.localeCompare(b.title)) }));
        const total = groups.reduce((n, group) => n + group.items.length, 0);
        let pageGroups = [], count = 0;
        const flush = () => {
          if (count) result.push({ day, groups: pageGroups, total });
          pageGroups = []; count = 0;
        };
        for (const group of groups) {
          for (let i = 0; i < group.items.length;) {
            if (count === pageCapacity) flush();
            const take = Math.min(
              pageCapacity - count,
              CONFIG.maxEventsPerTimeCard,
              group.items.length - i
            );
            pageGroups.push({ time: group.time, items: group.items.slice(i, i + take) });
            count += take;
            i += take;
          }
        }
        flush();
      }
      return result;
    }

    function splitColumns(groups) {
      if (root.clientWidth < 1400 || groups.length < 2 || groups.some(group => group.items.length >= 4)) {
        return [groups];
      }
      const weight = group => 42 + group.items.reduce((sum, event) =>
        sum + 34 * Math.ceil(event.title.length / 27)
        + (event.location ? 20 * Math.ceil(event.location.length / 37) + 7 : 0) + 9, 0);
      const weights = groups.map(weight);
      const total = weights.reduce((a, b) => a + b, 0);
      let left = 0, split = 1, best = Infinity;
      for (let i = 1; i < groups.length; i++) {
        left += weights[i - 1];
        const difference = Math.abs(total - 2 * left);
        if (difference < best) { best = difference; split = i; }
      }
      return [groups.slice(0, split), groups.slice(split)];
    }

    function prepareCelebrations(items, first, last, capacity) {
      const valid = items.filter(item =>
        item && (item.kind === "birthday" || item.kind === "anniversary") &&
        typeof item.name === "string" && item.name.trim() &&
        typeof item.date === "string" && item.date >= first && item.date <= last
      ).sort((a, b) => a.date.localeCompare(b.date) || a.kind.localeCompare(b.kind) || a.name.localeCompare(b.name));
      const result = [];
      for (let i = 0; i < valid.length; i += capacity) {
        result.push({ kind: "celebration", items: valid.slice(i, i + capacity) });
      }
      return result;
    }

    function drawCelebration(page) {
      const birthdays = page.items.filter(item => item.kind === "birthday");
      const anniversaries = page.items.filter(item => item.kind === "anniversary");
      currentDay.textContent = "Celebrating this week";
      countLabel.textContent = `${page.items.length} special date${page.items.length === 1 ? "" : "s"}`;

      const celebration = make("div", "vmsp-celebrate");
      const panels = make("div", "vmsp-celebrate-panels");
      if (!birthdays.length || !anniversaries.length) panels.classList.add("is-single");
      for (const [kind, entries, title] of [
        ["birthday", birthdays, "Happy Birthday!"],
        ["anniversary", anniversaries, "Happy Anniversary!"]
      ]) {
        if (!entries.length) continue;
        const panel = make("div", `vmsp-celebrate-panel is-${kind}`);
        const heading = make("div", "vmsp-celebrate-heading");
        heading.append(make("div", "vmsp-celebrate-title", title));
        heading.append(make("span", "vmsp-celebrate-count", `${entries.length} this week`));
        panel.append(heading);
        const names = make("div", "vmsp-names");
        for (const item of entries) {
          const row = make("div", "vmsp-person");
          const date = new Intl.DateTimeFormat("en-US", { timeZone: "UTC", month: "short", day: "numeric" })
            .format(asUtcDay(item.date));
          row.append(make("span", "vmsp-person-date", date));
          row.append(make("span", "vmsp-person-name", item.name));
          names.append(row);
        }
        panel.append(names);
        panels.append(panel);
      }
      celebration.append(panels);
      section.append(celebration);
    }

    function draw(index, animate = true) {
      const page = pages[index];
      root.classList.toggle("vmsp-celebrating", page.kind === "celebration");
      section.replaceChildren();
      if (page.kind === "celebration") {
        drawCelebration(page);
      } else {
        currentDay.textContent = dayLabel(page.day);
        countLabel.textContent = `${page.total} event${page.total === 1 ? "" : "s"}`;
        const list = make("div", "vmsp-list");
        const columns = splitColumns(page.groups);
        if (columns.length === 1) list.classList.add("is-single");
        const appendEvent = (parent, event) => {
          const item = make("div", "vmsp-event");
          item.append(make("div", "vmsp-event-title", event.title));
          if (event.location) item.append(make("div", "vmsp-location", event.location));
          parent.append(item);
        };
        for (const groups of columns) {
          const column = make("div", "vmsp-column");
          for (const group of groups) {
            const row = make("div", "vmsp-time-group");
            row.append(make("span", "vmsp-time", group.time));
            const titles = make("div", "vmsp-titles");
            if (columns.length === 1 && group.items.length >= 3 && root.clientWidth >= 900) {
              titles.classList.add("is-dense");
              const halfway = Math.ceil(group.items.length / 2);
              for (const items of [group.items.slice(0, halfway), group.items.slice(halfway)]) {
                const denseColumn = make("div", "vmsp-dense-column");
                for (const event of items) appendEvent(denseColumn, event);
                titles.append(denseColumn);
              }
            } else {
              for (const event of group.items) appendEvent(titles, event);
            }
            row.append(titles);
            column.append(row);
          }
          list.append(column);
        }
        section.append(list);
      }
      pageLabel.textContent = `${index + 1} / ${pages.length}`;
      pageLabel.hidden = pages.length < 2;
      progress.hidden = pages.length < 2;
      if (animate && pages.length > 1) {
        const remainingMs = Math.max(1, nextAdvanceAt - performance.now());
        progress.style.setProperty("--vmsp-progress-duration", `${remainingMs}ms`);
        progress.replaceChildren(...pages.map((_, i) =>
          make("i", i < index ? "done" : i === index ? "active" : "")));
      }
      if (animate) requestAnimationFrame(() => section.classList.add("is-visible"));
    }

    function advance() {
      if (pages.length < 2) return;
      nextAdvanceAt = performance.now() + pageIntervalMs;
      section.classList.remove("is-visible");
      section.classList.add("is-leaving");
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      transitionTimer = setTimeout(() => {
        pageIndex = (pageIndex + 1) % pages.length;
        section.classList.remove("is-leaving");
        draw(pageIndex);
      }, reduced ? 0 : transitionMs);
    }

    function layoutEvents(events, celebrations, first, last) {
      clearInterval(rotationTimer);
      clearTimeout(transitionTimer);
      section.classList.remove("is-visible", "is-leaving");
      section.hidden = false;
      empty.hidden = true;
      stage.style.overflowY = "hidden";

      const initialCapacity = root.clientWidth < 900 ? 4 : CONFIG.maxEventsPerPage;
      const stageStyle = getComputedStyle(stage);
      const availableHeight = stage.clientHeight
        - parseFloat(stageStyle.paddingTop) - parseFloat(stageStyle.paddingBottom);
      let eventFits = false;
      for (let capacity = initialCapacity; capacity >= 1; capacity--) {
        pages = prepare(events, first, last, capacity);
        if (!pages.length) { eventFits = true; break; }
        eventFits = true;
        for (let i = 0; i < pages.length; i++) {
          draw(i, false);
          if (section.scrollHeight > availableHeight + 1) {
            eventFits = false;
            break;
          }
        }
        if (eventFits) break;
      }
      const eventPages = pages;

      let celebrationPages = [];
      let celebrationFits = true;
      if (celebrations.length) {
        celebrationFits = false;
        for (let capacity = celebrations.length; capacity >= 1; capacity--) {
          pages = prepareCelebrations(celebrations, first, last, capacity);
          let candidateFits = true;
          for (let i = 0; i < pages.length; i++) {
            draw(i, false);
            if (section.scrollHeight > availableHeight + 1) {
              candidateFits = false;
              break;
            }
          }
          celebrationPages = pages;
          if (candidateFits) { celebrationFits = true; break; }
        }
      }
      pages = [...eventPages, ...celebrationPages];

      // A single exceptionally long event may still need scrolling, but the
      // footer remains anchored to the bottom of the widget.
      stage.style.overflowY = eventFits && celebrationFits ? "hidden" : "auto";
      pageIndex = 0;
      section.replaceChildren();
      section.hidden = pages.length === 0;
      empty.textContent = "No events or celebrations scheduled this week.";
      empty.hidden = pages.length > 0;
      if (pages.length > 1) {
        pageIntervalMs = CONFIG.fullRotationSeconds * 1000 / pages.length;
        transitionMs = matchMedia("(prefers-reduced-motion: reduce)").matches
          ? 0 : Math.min(450, pageIntervalMs * .28);
        section.style.setProperty("--vmsp-transition-ms", `${transitionMs}ms`);
        nextAdvanceAt = performance.now() + pageIntervalMs;
      }
      if (pages.length) draw(0);
      else {
        root.classList.remove("vmsp-celebrating");
        countLabel.textContent = "0 events";
        pageLabel.textContent = "";
        pageLabel.hidden = true;
        progress.hidden = true;
        progress.replaceChildren();
      }
      if (pages.length > 1) rotationTimer = setInterval(advance, pageIntervalMs);
    }

    function scheduleRefresh(delayMs) {
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(refresh, delayMs);
    }

    async function refresh() {
      if (refreshInProgress) return;
      refreshInProgress = true;
      let failed = false;
      const first = dateKey(new Date());
      const last = addDays(first, CONFIG.daysIncludingToday - 1);
      weekRange.textContent = `${shortDay(first)} – ${shortDay(last)}`;
      if (!pages.length) currentDay.textContent = dayLabel(first);
      try {
        const data = await fetchPageData();
        const eventsAvailable = Array.isArray(data.events);
        const celebrationsAvailable = Array.isArray(data.celebrations);
        failed = !eventsAvailable || !celebrationsAvailable;
        if (!eventsAvailable) console.warn("Events feed unavailable; retrying /events.");
        if (!celebrationsAvailable) console.warn("Celebrations feed unavailable; retrying /events.");
        if (!eventsAvailable && !celebrationsAvailable && !latestEvents && !latestCelebrations) {
          empty.textContent = "Waiting for the church schedule…";
          empty.hidden = false;
          return;
        }
        const events = eventsAvailable ? data.events : latestEvents || [];
        const celebrations = celebrationsAvailable ? data.celebrations : latestCelebrations || [];
        const changed = first !== latestFirst ||
          JSON.stringify(events) !== JSON.stringify(latestEvents) ||
          JSON.stringify(celebrations) !== JSON.stringify(latestCelebrations);
        latestEvents = events;
        latestCelebrations = celebrations;
        latestFirst = first;
        latestLast = last;
        status.textContent = "Full calendar in NYNE Copts App  ·  updated " + new Intl.DateTimeFormat("en-US", {
          timeZone: CONFIG.churchTimeZone, hour: "numeric", minute: "2-digit"
        }).format(new Date());
        if (changed || !pages.length) layoutEvents(events, celebrations, first, last);
      } catch (error) {
        failed = true;
        if (!pages.length) {
          empty.textContent = "Waiting for the church schedule…";
          empty.hidden = false;
        }
        console.error("Church calendar widget:", error);
      } finally {
        refreshInProgress = false;
        failedRefreshes = failed ? failedRefreshes + 1 : 0;
        const seconds = failed
          ? Math.min(CONFIG.retryMaxSeconds, CONFIG.retryBaseSeconds * 2 ** Math.min(failedRefreshes - 1, 8))
          : CONFIG.refreshMinutes * 60;
        if (failed) {
          status.textContent = `${pages.length ? "Showing last update" : "Connecting"} · retrying in ${seconds}s`;
        }
        scheduleRefresh(seconds * 1000);
      }
    }

    refresh();
    window.addEventListener("online", () => {
      if (!refreshInProgress) scheduleRefresh(0);
    });
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (latestEvents || latestCelebrations) {
          layoutEvents(latestEvents || [], latestCelebrations || [], latestFirst, latestLast);
        }
      }, 180);
    });
  })();
</script>
