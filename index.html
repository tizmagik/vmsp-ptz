<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera + Companion</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #111;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    .panel {
      height: 100%;
      overflow: hidden;
      position: relative;
      background: #000;
    }

    .video-panel {
      flex: 1 1 60%;
    }

    .companion-panel {
      flex: 1 1 40%;
      min-width: 200px;
      background: #222;
      border-left: 1px solid #444;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .companion-frame {
      width: 100%;
      height: 100%;
      border: none;
    }

    .resizer {
      width: 10px;
      background: #444;
      cursor: col-resize;
      user-select: none;
      flex: 0 0 10px;
      position: relative;
    }

    .resizer::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 4px;
      height: 40px;
      background: #666;
      border-radius: 2px;
    }

    .resizer:hover,
    .resizer.active {
      background: #666;
    }

    .status {
      position: absolute;
      bottom: 8px;
      left: 8px;
      padding: 6px 10px;
      font-family: monospace;
      font-size: 0.85em;
      border-radius: 4px;
      z-index: 5;
      pointer-events: none;
    }

    .loading {
      background: rgba(51, 40, 0, 0.8);
      color: #ffeb99;
    }

    .success {
      background: rgba(10, 46, 10, 0.8);
      color: #a3f7a3;
    }

    .error {
      background: rgba(51, 10, 10, 0.8);
      color: #f7a3a3;
    }

    .cam-buttons {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .cam-btn {
      padding: 8px 14px;
      background: #333;
      border: 1px solid #555;
      border-radius: 4px;
      font-size: 0.9em;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cam-btn:hover {
      background: #444;
    }

    .cam-btn.active {
      background: #0066cc;
      border-color: #0088ff;
      color: white;
    }

    @media (max-width: 767px) {
      .main {
        flex-direction: column;
      }

      .video-panel {
        flex: 1 1 60%;
      }

      .companion-panel {
        flex: 1 1 40%;
        min-height: 150px;
        border-left: none;
        border-top: 1px solid #444;
      }

      .resizer {
        height: 10px;
        width: 100%;
        cursor: row-resize;
      }

      .resizer::before {
        width: 40px;
        height: 4px;
      }

      .cam-buttons {
        top: 8px;
        left: 8px;
        gap: 6px;
      }

      .cam-btn {
        padding: 6px 10px;
        font-size: 0.8em;
      }
    }
  </style>
</head>

<body>
  <div class="main" id="main">
    <div class="panel video-panel">
      <div class="cam-buttons">
        <button class="cam-btn active" data-path="left">Left</button>
        <button class="cam-btn" data-path="main">Main</button>
        <button class="cam-btn" data-path="right">Right</button>
        <button class="cam-btn" data-path="altar">Altar</button>
        <button class="cam-btn" data-path="baptism">Baptism</button>
      </div>
      <iframe id="videoFrame" class="companion-frame" src="https://ptz-rtc.vmspchurch.org/left" title="Camera Stream" allowfullscreen style="display: block;"></iframe>
      <video id="videoPlayer" class="companion-frame" autoplay muted playsinline style="display: none;"></video>
      <div id="status" class="status success">Live (RTC)</div>
    </div>
    <div class="resizer" id="resizer"></div>
    <div class="panel companion-panel">
      <iframe class="companion-frame" src="https://ptz-companion.vmspchurch.org/emulator/upY2sQgNt-otH-JXfXeAl" title="Companion"
        allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups"></iframe>
    </div>
  </div>

  <script>
    const RTC_BASE_URL = 'https://ptz-rtc.vmspchurch.org';
    const HLS_BASE_URL = 'https://ptz-hls.vmspchurch.org';
    const videoFrame = document.getElementById('videoFrame');
    const videoPlayer = document.getElementById('videoPlayer');
    const status = document.getElementById('status');
    const main = document.getElementById('main');
    const resizer = document.getElementById('resizer');
    const videoPanel = main.children[0];
    const companionPanel = main.children[2];
    let isResizing = false;
    let currentPath = 'left';
    let currentMode = 'rtc'; // 'rtc' or 'hls'
    let iframeTimeout = null;
    let hls = null;
    let useHLSOnly = false; // Once HLS fallback is used, stick with it

    // Load HLS.js library dynamically if needed
    function loadHlsJs() {
      return new Promise((resolve, reject) => {
        if (window.Hls) {
          resolve(window.Hls);
          return;
        }
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/hls.js@latest';
        script.onload = () => resolve(window.Hls);
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    // Switch to HLS fallback
    async function fallbackToHLS(path) {
      console.log(`Falling back to HLS for ${path}`);
      currentMode = 'hls';
      useHLSOnly = true; // Remember that we need to use HLS
      
      // Hide iframe, show video player
      videoFrame.style.display = 'none';
      videoPlayer.style.display = 'block';
      
      status.textContent = `Live: ${path} (HLS)`;
      status.className = 'status loading';

      try {
        await loadHlsJs();
        
        const hlsUrl = `${HLS_BASE_URL}/${path}/index.m3u8`;
        
        if (window.Hls.isSupported()) {
          // Use HLS.js for browsers that don't support HLS natively
          if (hls) {
            hls.destroy();
          }
          hls = new window.Hls({
            enableWorker: true,
            lowLatencyMode: true,
          });
          
          hls.loadSource(hlsUrl);
          hls.attachMedia(videoPlayer);
          
          hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
            videoPlayer.play().then(() => {
              status.textContent = `Live: ${path} (HLS)`;
              status.className = 'status success';
            }).catch(err => {
              console.error('HLS playback error:', err);
              // Try to play anyway, some browsers require user interaction
              status.textContent = `Live: ${path} (HLS)`;
              status.className = 'status success';
            });
          });
          
          hls.on(window.Hls.Events.ERROR, (event, data) => {
            console.error('HLS.js error:', data);
            if (data.fatal) {
              switch (data.type) {
                case window.Hls.ErrorTypes.NETWORK_ERROR:
                  console.error('Fatal network error, trying to recover...');
                  hls.startLoad();
                  break;
                case window.Hls.ErrorTypes.MEDIA_ERROR:
                  console.error('Fatal media error, trying to recover...');
                  hls.recoverMediaError();
                  break;
                default:
                  status.textContent = `Error: ${path} (HLS failed)`;
                  status.className = 'status error';
                  break;
              }
            }
          });
        } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
          // Native HLS support (Safari)
          videoPlayer.src = hlsUrl;
          videoPlayer.addEventListener('loadedmetadata', () => {
            videoPlayer.play().then(() => {
              status.textContent = `Live: ${path} (HLS)`;
              status.className = 'status success';
            }).catch(err => {
              console.error('Native HLS playback error:', err);
              // Try to show as live anyway
              status.textContent = `Live: ${path} (HLS)`;
              status.className = 'status success';
            });
          });
          videoPlayer.addEventListener('error', (err) => {
            console.error('Native HLS error:', err);
            status.textContent = `Error: ${path} (HLS failed)`;
            status.className = 'status error';
          });
        } else {
          throw new Error('HLS not supported in this browser');
        }
      } catch (err) {
        console.error('Failed to load HLS:', err);
        status.textContent = `Error: ${path} (no HLS support)`;
        status.className = 'status error';
      }
    }

    // Try RTC first, with timeout fallback
    function loadRTC(path) {
      currentMode = 'rtc';
      
      // Show iframe, hide video player
      videoFrame.style.display = 'block';
      videoPlayer.style.display = 'none';
      
      // Clean up HLS if it was running
      if (hls) {
        hls.destroy();
        hls = null;
      }
      videoPlayer.src = '';
      
      status.textContent = `Loading: ${path} (RTC)`;
      status.className = 'status loading';
      
      // Clear any existing timeout
      if (iframeTimeout) {
        clearTimeout(iframeTimeout);
      }
      
      // Set iframe source
      videoFrame.src = `${RTC_BASE_URL}/${path}`;
      
      // Set a timeout to fallback to HLS if RTC doesn't load
      iframeTimeout = setTimeout(() => {
        console.warn(`RTC timeout for ${path}, falling back to HLS`);
        fallbackToHLS(path);
      }, 10000); // 10 second timeout
      
      // Try to detect if iframe loads successfully
      // Note: Due to CORS, we can't reliably detect iframe content load
      // The timeout is our main fallback mechanism
    }

    // Listen for messages from the RTC iframe (if it supports postMessage)
    window.addEventListener('message', (event) => {
      // Check if message is from our RTC domain
      if (event.origin === RTC_BASE_URL) {
        if (event.data && event.data.type === 'rtc-loaded') {
          // RTC loaded successfully
          if (iframeTimeout) {
            clearTimeout(iframeTimeout);
            iframeTimeout = null;
          }
          status.textContent = `Live: ${currentPath} (RTC)`;
          status.className = 'status success';
        } else if (event.data && event.data.type === 'rtc-error') {
          // RTC failed
          if (iframeTimeout) {
            clearTimeout(iframeTimeout);
            iframeTimeout = null;
          }
          fallbackToHLS(currentPath);
        }
      }
    });

    // === Camera Buttons ===
    document.querySelectorAll('.cam-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const path = btn.dataset.path;
        if (path === currentPath) return;

        // Update active button
        document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        currentPath = path;
        
        // If HLS fallback was used before, continue using HLS
        if (useHLSOnly) {
          fallbackToHLS(path);
        } else {
          loadRTC(path);
        }
      });
    });

    // Initial load
    loadRTC(currentPath);

    // === Smooth Resizer ===
    const startResize = e => {
      isResizing = true;
      resizer.classList.add('active');
      document.body.style.cursor = window.innerWidth <= 767 ? 'row-resize' : 'col-resize';
      e.preventDefault();
    };

    const doResize = e => {
      if (!isResizing) return;
      const rect = main.getBoundingClientRect();
      const isMobile = window.innerWidth <= 767;
      const ratio = isMobile
        ? (rect.bottom - e.clientY) / rect.height
        : (e.clientX - rect.left) / rect.width;
      const clamped = Math.max(0.2, Math.min(0.8, ratio));
      if (isMobile) {
        videoPanel.style.flex = `1 1 ${100 - clamped * 100}%`;
        companionPanel.style.flex = `1 1 ${clamped * 100}%`;
      } else {
        videoPanel.style.flex = `1 1 ${clamped * 100}%`;
        companionPanel.style.flex = `1 1 ${100 - clamped * 100}%`;
      }
    };

    const stopResize = () => {
      if (isResizing) {
        isResizing = false;
        resizer.classList.remove('active');
        document.body.style.cursor = '';
      }
    };

    resizer.addEventListener('mousedown', startResize);
    document.addEventListener('mousemove', doResize);
    document.addEventListener('mouseup', stopResize);
    resizer.addEventListener('touchstart', e => startResize(e.touches[0]));
    document.addEventListener('touchmove', e => { doResize(e.touches[0]); e.preventDefault(); });
    document.addEventListener('touchend', stopResize);

    window.addEventListener('resize', () => {
      resizer.style.cursor = window.innerWidth <= 767 ? 'row-resize' : 'col-resize';
    });
  </script>
</body>

</html>
