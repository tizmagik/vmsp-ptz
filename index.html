<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera + Companion</title>
  <script defer src="./reader.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #111;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    .panel {
      height: 100%;
      overflow: hidden;
      position: relative;
      background: #000;
    }

    .video-panel {
      flex: 1 1 60%;
    }

    .companion-panel {
      flex: 1 1 40%;
      min-width: 200px;
      background: #222;
      border-left: 1px solid #444;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .companion-frame {
      width: 100%;
      height: 100%;
      border: none;
    }

    .resizer {
      width: 10px;
      background: #444;
      cursor: col-resize;
      user-select: none;
      flex: 0 0 10px;
      position: relative;
    }

    .resizer::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 4px;
      height: 40px;
      background: #666;
      border-radius: 2px;
    }

    .resizer:hover,
    .resizer.active {
      background: #666;
    }

    .status {
      position: absolute;
      bottom: 8px;
      left: 8px;
      padding: 6px 10px;
      font-family: monospace;
      font-size: 0.85em;
      border-radius: 4px;
      z-index: 5;
      pointer-events: none;
    }

    .loading {
      background: rgba(51, 40, 0, 0.8);
      color: #ffeb99;
    }

    .success {
      background: rgba(10, 46, 10, 0.8);
      color: #a3f7a3;
    }

    .error {
      background: rgba(51, 10, 10, 0.8);
      color: #f7a3a3;
    }

    .cam-buttons {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .cam-btn {
      padding: 8px 14px;
      background: #333;
      border: 1px solid #555;
      border-radius: 4px;
      font-size: 0.9em;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cam-btn:hover {
      background: #444;
    }

    .cam-btn.active {
      background: #0066cc;
      border-color: #0088ff;
      color: white;
    }

    @media (max-width: 767px) {
      .main {
        flex-direction: column;
      }

      .video-panel {
        flex: 1 1 60%;
      }

      .companion-panel {
        flex: 1 1 40%;
        min-height: 150px;
        border-left: none;
        border-top: 1px solid #444;
      }

      .resizer {
        height: 10px;
        width: 100%;
        cursor: row-resize;
      }

      .resizer::before {
        width: 40px;
        height: 4px;
      }

      .cam-buttons {
        top: 8px;
        left: 8px;
        gap: 6px;
      }

      .cam-btn {
        padding: 6px 10px;
        font-size: 0.8em;
      }
    }
  </style>
</head>

<body>
  <div class="main" id="main">
    <div class="panel video-panel">
      <div class="cam-buttons">
        <button class="cam-btn active" data-path="left">Left</button>
        <button class="cam-btn" data-path="main">Main</button>
        <button class="cam-btn" data-path="right">Right</button>
        <button class="cam-btn" data-path="altar">Altar</button>
        <button class="cam-btn" data-path="baptism">Baptism</button>
      </div>
      <video id="videoPlayer" autoplay muted playsinline style="display: block;"></video>
      <iframe id="hlsFrame" class="companion-frame" style="display: none;"></iframe>
      <div id="status" class="status loading">Loading...</div>
    </div>
    <div class="resizer" id="resizer"></div>
    <div class="panel companion-panel">
      <iframe class="companion-frame" src="https://ptz-companion.vmspchurch.org/emulator/upY2sQgNt-otH-JXfXeAl" title="Companion"
        allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups"></iframe>
    </div>
  </div>

  <script>
    const RTC_BASE_URL = 'https://ptz-rtc.vmspchurch.org';
    const HLS_BASE_URL = 'https://ptz-hls.vmspchurch.org';
    const videoPlayer = document.getElementById('videoPlayer');
    const hlsFrame = document.getElementById('hlsFrame');
    const status = document.getElementById('status');
    const main = document.getElementById('main');
    const resizer = document.getElementById('resizer');
    const videoPanel = main.children[0];
    const companionPanel = main.children[2];
    let isResizing = false;
    let currentPath = 'left';
    let currentMode = 'rtc'; // 'rtc' or 'hls'
    let useHLSOnly = false; // Once HLS fallback is used, stick with it
    let rtcReader = null;
    let rtcTimeout = null; // Timeout to detect if RTC doesn't start playing

    // Switch to HLS fallback
    function fallbackToHLS(path) {
      console.log(`Falling back to HLS for ${path}`);
      currentMode = 'hls';
      useHLSOnly = true; // Remember that we need to use HLS
      
      // Hide video player, show HLS iframe
      videoPlayer.style.display = 'none';
      hlsFrame.style.display = 'block';
      
      // Set HLS iframe source
      hlsFrame.src = `${HLS_BASE_URL}/${path}`;
      
      status.textContent = `Live: ${path} (HLS)`;
      status.className = 'status success';
    }

    // Load RTC stream using reader.js
    function loadRTC(path) {
      currentMode = 'rtc';
      
      // Show video player, hide HLS iframe
      videoPlayer.style.display = 'block';
      hlsFrame.style.display = 'none';
      
      // Clean up previous RTC reader
      if (rtcReader) {
        rtcReader.close();
        rtcReader = null;
      }
      
      // Clear any existing timeout
      if (rtcTimeout) {
        clearTimeout(rtcTimeout);
        rtcTimeout = null;
      }
      
      videoPlayer.srcObject = null;
      
      status.textContent = `Loading: ${path} (RTC)`;
      status.className = 'status loading';
      
      let trackReceived = false;
      let videoStarted = false;
      
      // Set a timeout to fallback if video doesn't start playing
      rtcTimeout = setTimeout(() => {
        if (!videoStarted && currentMode === 'rtc') {
          console.warn('RTC timeout - video not playing, falling back to HLS');
          if (rtcReader) {
            rtcReader.close();
            rtcReader = null;
          }
          fallbackToHLS(path);
        }
      }, 8000); // 8 second timeout
      
      // Listen for video playing event
      const onPlaying = () => {
        videoStarted = true;
        if (rtcTimeout) {
          clearTimeout(rtcTimeout);
          rtcTimeout = null;
        }
        if (trackReceived) {
          status.textContent = `Live: ${path} (RTC)`;
          status.className = 'status success';
        }
        videoPlayer.removeEventListener('playing', onPlaying);
      };
      
      videoPlayer.addEventListener('playing', onPlaying);
      
      // Create WebRTC reader with proper error handling
      rtcReader = new window.MediaMTXWebRTCReader({
        url: `${RTC_BASE_URL}/${path}/whep`,
        onError: (err) => {
          console.error('WebRTC error:', err);
          status.textContent = `RTC failed: ${path}`;
          status.className = 'status error';
          
          // Clear timeout since we're handling the error now
          if (rtcTimeout) {
            clearTimeout(rtcTimeout);
            rtcTimeout = null;
          }
          
          videoPlayer.removeEventListener('playing', onPlaying);
          
          // Fallback to HLS on error
          fallbackToHLS(path);
        },
        onTrack: (evt) => {
          console.log('WebRTC track received');
          trackReceived = true;
          videoPlayer.srcObject = evt.streams[0];
          
          // Try to play the video
          videoPlayer.play().catch(err => {
            console.error('Video play error:', err);
            // On mobile, autoplay might be blocked, but that's ok
            // The timeout will still trigger if video never starts
          });
          
          // Update status if video is already playing
          if (videoStarted) {
            status.textContent = `Live: ${path} (RTC)`;
            status.className = 'status success';
          }
        },
      });
    }

    // === Camera Buttons ===
    document.querySelectorAll('.cam-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const path = btn.dataset.path;
        if (path === currentPath) return;

        // Update active button
        document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        currentPath = path;
        
        // If HLS fallback was used before, continue using HLS
        if (useHLSOnly) {
          fallbackToHLS(path);
        } else {
          loadRTC(path);
        }
      });
    });

    // Initial load - wait for page to be ready
    window.addEventListener('load', () => {
      loadRTC(currentPath);
    });

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      if (rtcReader) {
        rtcReader.close();
      }
    });

    // === Smooth Resizer ===
    const startResize = e => {
      isResizing = true;
      resizer.classList.add('active');
      document.body.style.cursor = window.innerWidth <= 767 ? 'row-resize' : 'col-resize';
      e.preventDefault();
    };

    const doResize = e => {
      if (!isResizing) return;
      const rect = main.getBoundingClientRect();
      const isMobile = window.innerWidth <= 767;
      const ratio = isMobile
        ? (rect.bottom - e.clientY) / rect.height
        : (e.clientX - rect.left) / rect.width;
      const clamped = Math.max(0.2, Math.min(0.8, ratio));
      if (isMobile) {
        videoPanel.style.flex = `1 1 ${100 - clamped * 100}%`;
        companionPanel.style.flex = `1 1 ${clamped * 100}%`;
      } else {
        videoPanel.style.flex = `1 1 ${clamped * 100}%`;
        companionPanel.style.flex = `1 1 ${100 - clamped * 100}%`;
      }
    };

    const stopResize = () => {
      if (isResizing) {
        isResizing = false;
        resizer.classList.remove('active');
        document.body.style.cursor = '';
      }
    };

    resizer.addEventListener('mousedown', startResize);
    document.addEventListener('mousemove', doResize);
    document.addEventListener('mouseup', stopResize);
    resizer.addEventListener('touchstart', e => startResize(e.touches[0]));
    document.addEventListener('touchmove', e => { doResize(e.touches[0]); e.preventDefault(); });
    document.addEventListener('touchend', stopResize);

    window.addEventListener('resize', () => {
      resizer.style.cursor = window.innerWidth <= 767 ? 'row-resize' : 'col-resize';
    });
  </script>
</body>

</html>
